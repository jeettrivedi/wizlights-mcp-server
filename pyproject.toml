[project]
name = "wizlights-mcp-server"
version = "0.1.0"
description = "MCP Serve to control WiZ lights"
authors = [
    { name="Jeet Trivedi", email= "jtriv@protonmail.com" },
]
readme = "README.md"
keywords = ["MCP", "wizlights"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=48.0.1",
    "h11>=0.16.0",
    "idna>=3.15",
    "mcp[cli]>=1.23.0",
    "pydantic>=2.11.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pywizlight>=0.6.2",
    "starlette>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
py-modules = ["wizlights_mcp_server"]

[dependency-groups]
dev = [
    "filelock>=3.20.3",
    "pre-commit>=4.5.1",
    "virtualenv>=20.36.1",
]

[project.scripts]
wizlights-mcp-server = "wizlights_mcp_server.__main__:main"
